        async function gerarExcel() {
            const statusDiv = document.getElementById('status');
            statusDiv.className = 'status processing';
            statusDiv.innerHTML = '⏳ Processando dados...';

            try {
                // Carregar dados do JSON
                const response = await fetch('index.html');
                const text = await response.text();
                const events = JSON.parse(text);

                // Organizar por usuário
                const userClients = {};
                let totalClients = 0;

                events.forEach(event => {
                    if (event.Operation === 'Add row' && event.Data) {
                        try {
                            const data = JSON.parse(event.Data);
                            const userId = event.UserId;
                            const clientName = data[2] || 'Sem nome';
                            const nickname = data[3] || '';
                            
                            if (!userClients[userId]) {
                                userClients[userId] = [];
                            }

                            const contact = clientContactMapping[clientName] || { phone: 'Não informado', email: 'Não informado' };
                            
                            userClients[userId].push({
                                'ID': data[0] || '',
                                'Nome do Cliente': clientName,
                                'Apelido/Empresa': nickname,
                                'Telefone': contact.phone,
                                'Email': contact.email,
                                'Data de Cadastro': new Date(event.EventTimeStamp).toLocaleString('pt-BR')
                            });
                            totalClients++;
                        } catch (e) {
                            console.error('Erro ao processar evento:', e);
                        }
                    }
                });

                // Atualizar estatísticas
                document.getElementById('totalClients').textContent = totalClients;
                document.getElementById('totalUsers').textContent = Object.keys(userClients).length;
                document.getElementById('totalSheets').textContent = Object.keys(userClients).length + 1;

                // Criar workbook
                const wb = XLSX.utils.book_new();

                // Criar aba RESUMO
                const resumoData = [];
                resumoData.push(['RESUMO GERAL - CLIENTES ADICIONADOS']);
                resumoData.push([]);
                resumoData.push(['Colaborador', 'Email', 'Qtd. Clientes']);
                
                Object.keys(userClients).forEach(userId => {
                    const user = userMapping[userId] || { name: `Usuário ${userId}`, email: 'N/A' };
                    resumoData.push([user.name, user.email, userClients[userId].length]);
                });
                
                resumoData.push([]);
                resumoData.push(['TOTAL DE CLIENTES:', '', totalClients]);
                resumoData.push(['Data de Geração:', new Date().toLocaleString('pt-BR')]);

                const wsResumo = XLSX.utils.aoa_to_sheet(resumoData);
                wsResumo['!cols'] = [{ wch: 30 }, { wch: 35 }, { wch: 15 }];
                XLSX.utils.book_append_sheet(wb, wsResumo, 'RESUMO');

                // Criar abas por usuário
                Object.keys(userClients).forEach(userId => {
                    const user = userMapping[userId] || { name: `Usuário ${userId}`, email: 'N/A' };
                    const clients = userClients[userId];
                    
                    const ws = XLSX.utils.json_to_sheet(clients);
                    ws['!cols'] = [
                        { wch: 10 },  // ID
                        { wch: 30 },  // Nome
                        { wch: 25 },  // Apelido
                        { wch: 18 },  // Telefone
                        { wch: 30 },  // Email
                        { wch: 20 }   // Data
                    ];
                    
                    const sheetName = user.name.substring(0, 30); // Excel limita a 31 caracteres
                    XLSX.utils.book_append_sheet(wb, ws, sheetName);
                });

                // Criar aba TODOS OS CLIENTES
                const allClients = [];
                Object.keys(userClients).forEach(userId => {
                    const user = userMapping[userId] || { name: `Usuário ${userId}` };
                    userClients[userId].forEach(client => {
                        allClients.push({
                            'Colaborador': user.name,
                            ...client
                        });
                    });
                });
                
                const wsAll = XLSX.utils.json_to_sheet(allClients);
                wsAll['!cols'] = [
                    { wch: 25 },  // Colaborador
                    { wch: 10 },  // ID
                    { wch: 30 },  // Nome
                    { wch: 25 },  // Apelido
                    { wch: 18 },  // Telefone
                    { wch: 30 },  // Email
                    { wch: 20 }   // Data
                ];
                XLSX.utils.book_append_sheet(wb, wsAll, 'TODOS');

                // Gerar arquivo
                const fileName = `Clientes_Por_Colaborador_${new Date().toISOString().split('T')[0]}.xlsx`;
                XLSX.writeFile(wb, fileName);

                statusDiv.className = 'status success';
                statusDiv.innerHTML = `
                    ✅ <strong>Excel gerado com sucesso!</strong><br>
                    📁 Arquivo: ${fileName}<br>
                    📊 ${totalClients} clientes em ${Object.keys(userClients).length} abas
                `;

            } catch (error) {
                statusDiv.className = 'status';
                statusDiv.style.display = 'block';
                statusDiv.style.background = '#f8d7da';
                statusDiv.style.color = '#721c24';
                statusDiv.style.border = '2px solid #f5c6cb';
                statusDiv.innerHTML = `❌ Erro ao gerar Excel: ${error.message}`;
                console.error(error);
            }
        }

        // Carregar estatísticas ao abrir a página
        window.addEventListener('load', async () => {
            try {
                const response = await fetch('index.html');
                const text = await response.text();
                const events = JSON.parse(text);
                
                const userClients = {};
                let totalClients = 0;

                events.forEach(event => {
                    if (event.Operation === 'Add row' && event.Data) {
                        try {
                            const data = JSON.parse(event.Data);
                            const userId = event.UserId;
                            if (!userClients[userId]) {
                                userClients[userId] = [];
                            }
                            userClients[userId].push(data);
                            totalClients++;
                        } catch (e) {}
                    }
                });

                document.getElementById('totalClients').textContent = totalClients;
                document.getElementById('totalUsers').textContent = Object.keys(userClients).length;
                document.getElementById('totalSheets').textContent = Object.keys(userClients).length + 1;
            } catch (error) {
                console.error('Erro ao carregar estatísticas:', error);
            }
